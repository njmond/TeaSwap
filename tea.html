<!DOCTYPE html>
<html>
<head>
  <title>Tea Swap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .header {
      background-image: linear-gradient(to right, #34A85A, #56B3FA);
      color: #fff;
      padding: 1em;
      text-align: center;
    }
    .logo {
      float: left;
      font-size: 24px;
      margin-left: 20px;
    }
    .connect-wallet {
      float: right;
      font-size: 20px;
      margin-right: 20px;
      cursor: pointer;
      padding: 15px 25px;
      border-radius: 24px;
      background-color: #ff5733;
      color: #34A85A;
    }
    .swap-menu {
      margin-top: 20px;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Tea Swap</div>
    <div class="connect-wallet" id="connect-wallet">Connect Wallet</div>
  </div>
  <div class="swap-menu">
    <h2>Swap Menu</h2>
    <form id="swap-form">
      <label>From:</label>
      <select id="from-token" name="from-token">
        <option value="TES">ETH</option>
        <option value="USDT">USDT</option>
        <option value="DAI">DAI</option>
      </select>
      <br>
      <label>To:</label>
      <select id="to-token" name="to-token">
        <option value="TEA">ETH</option>
        <option value="USDT">USDT</option>
        <option value="DAI">DAI</option>
      </select>
      <br>
      <label>Amount:</label>
      <input type="number" id="amount" name="amount">
      <br>
      <button id="swap-button">Swap</button>
    </form>
  </div>
  <script>
    import { MetaMaskSDK } from "@metamask/sdk";
    const MMSDK = new MetaMaskSDK({
      // Required - Your dapp's info
      dappMetadata: {
        name: "Tea Swap",
        url: window.location.href,
      },
      // Optional - Infura API key for read-only RPC calls
      infuraAPIKey: process.env.INFURA_API_KEY,
      // Optional - Customize modal display
      headless: false,
    });

    const connectWalletButton = document.getElementById('connect-wallet');
    connectWalletButton.addEventListener('click', async () => {
      try {
        // Connect and get accounts
        const accounts = await MMSDK.connect();
        console.log('Alamat wallet:', accounts[0]);
        // Get provider for RPC requests
        const provider = MMSDK.getProvider();
        // Make an RPC request
        const result = await provider.request({
          method: "eth_accounts",
          params: [],
        });
        console.log('Daftar akun:', result);
      } catch (error) {
        console.error('Error:', error);
      }
    });

    const swapForm = document.getElementById('swap-form');
    swapForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const fromToken = document.getElementById('from-token').value;
        const toToken = document.getElementById('to-token').value;
        const amount = document.getElementById('amount').value;
        // Get Uniswap API
        const uniswapApi = `https://api.thegraph.com/subgraphs/name/uniswap/uniswap-v2`;
        const response = await fetch(uniswapApi, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            query: `query {
              pair(id: "${fromToken}-${toToken}") {
                token0 {
                  symbol
                }
                token1 {
                  symbol
                }
                reserve0
                reserve1
              }
            }`,
          }),
        });
        const data = await response
